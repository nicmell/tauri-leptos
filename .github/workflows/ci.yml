name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install leptosfmt, nextest and cargo-leptos
        run: cargo binstall -y leptosfmt cargo-nextest cargo-leptos
      - name: Build frontend and server
        run: cargo leptos build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: leptosfmt
        run: leptosfmt --check crates/ui/src
      - name: clippy (native)
        run: cargo clippy --workspace --all-targets
      - name: clippy (ui ssr)
        run: cargo clippy -p tauri-leptos-ui --features ssr
      - name: clippy (ui hydrate, wasm)
        run: cargo clippy -p tauri-leptos-ui --features hydrate --target wasm32-unknown-unknown
      - name: clippy (shell, release branch)
        # Plain cargo emits cfg(dev); activating tauri/custom-protocol
        # flips it off so the embedded-site branch gets linted too.
        run: cargo clippy -p tauri-leptos --features tauri/custom-protocol
      - name: tests
        run: cargo nextest run --workspace --no-tests=pass
      # Last: it rewrites the working tree. Proves the template is still
      # renameable — any new file that reintroduces the old names (or a
      # name the script misses) fails here instead of in someone's app.
      - name: rename smoke
        run: |
          ./scripts/rename-app.sh --name Acme --slug acme-app \
            --identifier com.acme.app --author "Ada <ada@acme.com>"
          cargo leptos build
          cargo clippy --workspace --all-targets
          cargo nextest run --workspace --no-tests=pass
          git checkout -- . && git clean -fdq

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

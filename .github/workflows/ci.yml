name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install leptosfmt, nextest and cargo-leptos
        run: cargo binstall -y leptosfmt cargo-nextest cargo-leptos
      - name: Build frontend and server
        run: cargo leptos build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: leptosfmt
        run: leptosfmt --check crates/ui/src
      - name: clippy (native)
        run: cargo clippy --workspace --all-targets
      - name: clippy (ui ssr)
        run: cargo clippy -p tauri-leptos-ui --features ssr
      - name: clippy (ui hydrate, wasm)
        run: cargo clippy -p tauri-leptos-ui --features hydrate --target wasm32-unknown-unknown
      - name: tests
        run: cargo nextest run --workspace --no-tests=pass
      - name: tests (ui ssr)
        run: cargo nextest run -p tauri-leptos-ui --features ssr --no-tests=pass

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-leptos
        run: cargo binstall -y cargo-leptos
      - name: Build frontend and server
        # release site: dev cargo-leptos builds carry hot-reload
        # instrumentation only its own dev-server can hydrate against
        run: |
          cargo leptos build --release
          cargo build -p tauri-leptos-cli --features frontend
      - name: Hydration smoke (headless chrome)
        run: node scripts/e2e-smoke.mjs

  release-dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-leptos
        run: cargo binstall -y cargo-leptos
      - name: Build frontend (release)
        run: cargo leptos build --release
      - name: Build server (host release)
        run: cargo build --release -p tauri-leptos-cli --features frontend
      - name: Build server (aarch64 release)
        run: cargo build --release -p tauri-leptos-cli --features frontend --target aarch64-unknown-linux-gnu
      - name: Collect release pair
        run: |
          mkdir -p dist-artifact
          cp target/aarch64-unknown-linux-gnu/release/tauri-leptos-cli dist-artifact/
          cp -r target/site dist-artifact/site
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-leptos-aarch64
          path: dist-artifact/

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

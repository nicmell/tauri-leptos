[workspace]
resolver = "3"
members = ["crates/app-cli", "crates/core", "crates/protocol", "crates/ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <you@example.com>"]
license = "MIT-0"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic opt-outs: noisy without adding safety in this codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# fires (clippy >= 1.98) inside #[server]-generated trait impls, which an
# item-level allow cannot reach
unused_async_trait_impl = "allow"

[workspace.dependencies]
# frontend
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos_axum = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
tower-http = { version = "0.7", features = ["fs"] }
console_error_panic_hook = "0.1.7"

# backend
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4.6", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-leptos-ssr = { git = "https://github.com/nicmell/tauri-plugin-leptos-ssr", tag = "v0.1.0" }
tauri-plugin-log = "2.10"
log = "0.4"
tokio-tungstenite = "0.29"
futures-util = "0.3"

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tauri-leptos-core = { path = "crates/core" }
tauri-leptos-protocol = { path = "crates/protocol" }
tauri-leptos-ui = { path = "crates/ui" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[[workspace.metadata.leptos]]
name = "tauri-leptos"
bin-package = "tauri-leptos-cli"
bin-features = []
lib-package = "tauri-leptos-ui"
lib-features = ["hydrate"]
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
style-file = "crates/ui/style/main.css"
assets-dir = "crates/ui/public"
# cargo-leptos dev builds compile leptos with other flags than the Tauri
# build; separate target dirs keep them from rebuilding each other.
bin-target-dir = "target/server"

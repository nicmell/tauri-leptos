[workspace]
resolver = "3"
members = ["crates/app-cli", "crates/app-core", "crates/ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["nicmell"]
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic opt-outs: noisy without adding safety in this codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# frontend
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.7", features = ["http", "websocket"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
tracing-web = "0.1"
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1.7"

# backend
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4.6", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing-appender = "0.2"
paranoid-android = "0.2"
tauri-leptos-core = { path = "crates/app-core" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

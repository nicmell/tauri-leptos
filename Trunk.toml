[build]
target = "./crates/ui/index.html"
dist = "./dist"

[watch]
ignore = ["./src-tauri"]

[serve]
port = 1420
open = false

# Dev loop: `cargo run -p tauri-leptos-cli -- serve` on :3000, then
# `trunk serve` — the browser stays same-origin through these proxies.
[[proxy]]
backend = "ws://127.0.0.1:3000/ws"
ws = true

[[proxy]]
backend = "http://127.0.0.1:3000/api/"

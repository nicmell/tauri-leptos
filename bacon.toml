# bacon — background code checker (https://dystroy.org/bacon/)
default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets"]
need_stdout = false

[jobs.clippy-wasm]
command = ["cargo", "clippy", "-p", "tauri-leptos-ui", "--features", "hydrate", "--target", "wasm32-unknown-unknown"]
need_stdout = false

[jobs.test]
command = ["cargo", "nextest", "run", "--workspace", "--no-tests=pass"]
need_stdout = true

[jobs.doc]
command = ["cargo", "doc", "--workspace", "--no-deps"]
need_stdout = false

# Headless server with restart-on-change; pair with `trunk serve` for
# the full browser dev loop.
[jobs.serve]
command = [
  "cargo",
  "run",
  "-p",
  "tauri-leptos-cli",
  "--",
  "serve",
  "--app-dir",
  "appdir",
  "--listen",
  "127.0.0.1:3001",
]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
allow_warnings = true

[keybindings]
c = "job:clippy"
w = "job:clippy-wasm"
t = "job:test"
d = "job:doc"
s = "job:serve"

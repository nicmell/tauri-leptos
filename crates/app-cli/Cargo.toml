[package]
name = "tauri-leptos-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
leptos = { workspace = true, features = ["ssr"] }
tauri-leptos-ui = { workspace = true, features = ["ssr"] }
tokio.workspace = true
tower-http.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Your Name <you@example.com>"
extended-description = "tauri-leptos server (the SSR app) for systemd deployments"
maintainer-scripts = "debian/"
assets = [
  ["target/release/tauri-leptos-cli", "usr/bin/", "755"],
  ["../../target/site/**/*", "usr/share/tauri-leptos/site/", "644"],
]

# Empty table = defaults: enable+start on install, stop+disable on
# removal, restart after upgrade.
[package.metadata.deb.systemd-units]

[package]
name = "tauri-leptos-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri-leptos-core.workspace = true
tauri-leptos-ui = { path = "../ui", features = ["ssr"], optional = true }

[features]
default = []
# Serve the SSR frontend from this binary (production); without it the
# binary is the dev API server (axum only, fast builds, stable state).
frontend = ["dep:tauri-leptos-ui"]

[lints]
workspace = true

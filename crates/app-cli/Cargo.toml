[package]
name = "tauri-leptos-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri-leptos-core.workspace = true
tauri-leptos-ui = { path = "../ui", features = ["ssr"], optional = true }

[features]
default = ["site"]
# Embedded SSR frontend (leptos). Without it the binary has no site.
site = ["dep:tauri-leptos-ui"]
# Dev proxy to the cargo-leptos watch server (mutually exclusive with
# `site`): api stays here, pages/assets come from the watch.
dev = ["tauri-leptos-core/dev"]

[lints]
workspace = true

[package.metadata.deb]
maintainer = "nicmell <nicola.melloni@slesh.it>"
extended-description = "tauri-leptos server (SSR frontend + API) for systemd deployments"
maintainer-scripts = "debian/"
assets = [
  ["target/release/tauri-leptos-cli", "usr/bin/", "755"],
  ["../../target/site/**/*", "usr/share/tauri-leptos/site/", "644"],
]

# Empty table = defaults: enable+start on install, stop+disable on
# removal, restart after upgrade.
[package.metadata.deb.systemd-units]

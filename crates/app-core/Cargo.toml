[package]
name = "tauri-leptos-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "ansi"] }
tracing-appender.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
axum-reverse-proxy = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android.workspace = true

[features]
# Dev proxy backend (assets::ProxyAssets) for builds without leptos.
dev = ["dep:axum-reverse-proxy"]

[lints]
workspace = true

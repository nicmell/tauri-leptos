[package]
name = "tauri-leptos-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "ansi"] }
tracing-appender.workspace = true
axum.workspace = true
tower-http.workspace = true
axum-reverse-proxy = { workspace = true, optional = true }
tauri-leptos-ui = { path = "../ui", features = ["ssr"] }
tauri = { workspace = true, optional = true }
tauri-plugin-fs = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android.workspace = true

[features]
# Tauri integration: StaticAssets::from_tauri_fs (APK-safe asset
# access via the fs plugin) and AppPaths::from_tauri (real path API).
tauri = [
  "dep:tauri",
  "dep:tauri-plugin-fs",
  "dep:axum-reverse-proxy",
]

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true

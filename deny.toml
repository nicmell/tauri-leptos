[graph]
all-features = true

[advisories]
yanked = "deny"
# only flag unmaintained crates we depend on directly; transitive ones
# belong to tauri/leptos upstream
unmaintained = "workspace"

[licenses]
# workspace crates are unpublished and carry no license yet
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# path-only workspace deps (tauri-leptos-core) carry no version; private crates only
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

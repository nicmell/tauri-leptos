# Dev loop: SSR frontend with hot reload (cargo leptos watch, :3000)
# + the state-holding API server (:3001, never restarted by UI work).
# Desktop shell: `cargo tauri dev` (spawns its own watch instead).
procs:
  watch:
    cmd: ["cargo", "leptos", "watch"]
  api:
    cmd:
      [
        "cargo",
        "run",
        "-p",
        "tauri-leptos-cli",
        "--",
        "--app-dir",
        "appdir",
        "serve",
      ]

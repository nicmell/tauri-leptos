[package]
name = "tauri-leptos"
description = "A Tauri App"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_leptos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tracing.workspace = true
tauri-leptos-core.workspace = true
tauri-leptos-ui = { path = "../crates/ui", features = ["ssr"], optional = true }
tauri-plugin-fs.workspace = true
axum.workspace = true
tower.workspace = true
mime_guess.workspace = true
tokio-util.workspace = true
tokio.workspace = true

[features]
default = ["site"]
# Embedded SSR frontend served from the bundled resources.
site = ["dep:tauri-leptos-ui"]
# Dev shell (no leptos): api in-process, pages/assets reverse-proxied
# from the `cargo leptos watch` server.
dev = ["tauri-leptos-core/dev"]

[lints]
workspace = true

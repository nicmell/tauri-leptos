[package]
name = "tauri-leptos"
description = "A Tauri App"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_leptos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tracing.workspace = true
tauri-leptos-core.workspace = true
tauri-leptos-ui = { path = "../crates/ui", features = ["ssr"], optional = true }

# Mobile is always in-process: no watch server to attach to on a device.
[target.'cfg(target_os = "android")'.dependencies]
tauri-leptos-ui = { path = "../crates/ui", features = ["ssr"] }

[features]
default = []
# In-process SSR server (production desktop: `cargo tauri build -f ssr`).
# Without it (desktop dev) the webview attaches to `cargo leptos watch`.
ssr = ["dep:tauri-leptos-ui"]

[lints]
workspace = true
